app = "watchfetcher"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  GBPUSD = "1.27"
  EURUSD = "1.08"
  CHFUSD = "1.12"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[services.http_checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
